<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05081a">
<title>슈퍼 전투기 대작전</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05081a; color:#fff;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }

  .screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; gap:18px;
    justify-content:center; justify-content:safe center;
    background:radial-gradient(circle at 50% 35%, rgba(30,60,140,.75), rgba(5,8,26,.96) 70%);
    padding:24px; text-align:center; z-index:10;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .screen.hidden { display:none; }
  .title {
    font-size:clamp(30px,9vw,54px); font-weight:900; letter-spacing:-1px;
    background:linear-gradient(180deg,#fff,#7dd3ff 55%,#3b82f6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(80,160,255,.35);
  }
  .sub { font-size:clamp(13px,3.6vw,17px); color:#9fb6d9; line-height:1.7; }
  .btn {
    padding:16px 40px; border:none; border-radius:999px;
    font-size:clamp(17px,4.6vw,21px); font-weight:800; color:#04122b;
    background:linear-gradient(180deg,#8ee7ff,#2f9cf5);
    box-shadow:0 8px 0 #14508f, 0 14px 30px rgba(47,156,245,.45);
    cursor:pointer; transition:transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translateY(6px); box-shadow:0 2px 0 #14508f, 0 6px 16px rgba(47,156,245,.4); }
  .btn.ghost {
    background:rgba(255,255,255,.1); color:#cfe4ff;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); padding:12px 28px; font-size:16px;
  }
  .btn.ghost:active { transform:translateY(2px); box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
  .card {
    background:rgba(10,20,45,.7); border:1px solid rgba(120,180,255,.25);
    border-radius:18px; padding:16px 22px; font-size:15px; color:#bcd4f5; line-height:1.9;
    max-width:340px;
  }
  .big-score { font-size:clamp(34px,10vw,52px); font-weight:900; color:#ffd76a; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .entry { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .entry.hidden, .rank.hidden { display:none; }
  .entry-row { display:flex; gap:8px; align-items:center; }
  #nameInput {
    width:150px; padding:12px 14px; border-radius:12px;
    border:2px solid rgba(120,180,255,.45); background:rgba(8,16,38,.9);
    color:#fff; font-size:17px; font-weight:700; text-align:center;
    font-family:inherit;
  }
  #nameInput:focus { outline:none; border-color:#7dd3ff; box-shadow:0 0 0 3px rgba(125,211,255,.22); }
  #nameInput::placeholder { color:#5f769b; font-weight:500; }
  .btn.small { padding:12px 22px; font-size:16px; box-shadow:0 5px 0 #14508f; }
  .btn.small:active { box-shadow:0 1px 0 #14508f; }

  .rank {
    display:flex; flex-direction:column; gap:2px; width:min(340px,86vw);
    background:rgba(10,20,45,.7); border:1px solid rgba(120,180,255,.25);
    border-radius:16px; padding:12px 14px;
  }
  .rank-title {
    font-size:12px; font-weight:800; letter-spacing:2px; color:#8fa8cc;
    text-align:center; padding-bottom:6px;
  }
  .rank-row {
    display:grid; grid-template-columns:28px 1fr auto; align-items:center;
    gap:8px; padding:6px 8px; border-radius:8px; font-size:15px; color:#cfe0f7;
  }
  .rank-row .pos { font-weight:800; color:#7f9ac0; text-align:center; }
  .rank-row .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .rank-row .sc { font-weight:800; color:#ffd76a; font-variant-numeric:tabular-nums; }
  .rank-row.me { background:rgba(125,211,255,.16); box-shadow:inset 0 0 0 1px rgba(125,211,255,.4); }
  .rank-row.top1 .pos { color:#ffd700; }
  .rank-row.top2 .pos { color:#c7d2de; }
  .rank-row.top3 .pos { color:#e0a56a; }
  .rank-empty { font-size:13px; color:#7f93b3; text-align:center; padding:6px 0; }

  #pauseBtn {
    position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:5;
    width:44px; height:44px; border-radius:12px; border:none;
    background:rgba(255,255,255,.14); color:#fff; font-size:18px; cursor:pointer;
  }
  #pauseBtn.hidden { display:none; }
  #soundBtn {
    position:absolute; top:calc(10px + env(safe-area-inset-top)); right:64px; z-index:20;
    width:44px; height:44px; border-radius:12px; border:none;
    background:rgba(255,255,255,.14); color:#fff; font-size:18px; cursor:pointer;
  }
  #soundBtn.off { opacity:.5; }
  .fade { animation:fade .25s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <button id="pauseBtn" class="hidden">❚❚</button>
  <button id="soundBtn" title="소리 켜기/끄기">🔊</button>

  <div id="startScreen" class="screen">
    <div class="title">슈퍼 전투기<br>대작전</div>
    <div class="sub">화면을 손가락으로 움직여 조종해요<br>총알은 자동으로 나가요! 🚀</div>
    <button id="startBtn" class="btn">게임 시작</button>
    <div class="card">
      💊 <b>초록 아이템</b> — 체력 회복<br>
      ⚡ <b>파란 아이템</b> — 총알 강화<br>
      🛡️ <b>노란 아이템</b> — 보호막<br>
      💣 <b>분홍 아이템</b> — 폭탄 １개<br>
      💥 <b>폭탄 버튼</b> — 화면 전체 공격
    </div>
    <div id="rankHome" class="rank hidden"></div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <div class="title" style="font-size:clamp(26px,7vw,40px)">잠깐 멈춤</div>
    <button id="resumeBtn" class="btn">계속하기</button>
    <button id="quitBtn" class="btn ghost">처음으로</button>
  </div>

  <div id="overScreen" class="screen hidden">
    <div class="title" id="overTitle" style="font-size:clamp(28px,8vw,44px)">격추당했어요!</div>
    <div class="big-score" id="finalScore">0</div>
    <div class="sub" id="overSub"></div>

    <div id="nameEntry" class="entry hidden">
      <div class="sub">순위표에 이름을 남겨요! 🏅</div>
      <div class="entry-row">
        <input id="nameInput" type="text" maxlength="6" placeholder="이름" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="saveScoreBtn" class="btn small">등록</button>
      </div>
    </div>

    <div id="rankOver" class="rank hidden"></div>

    <div class="row">
      <button id="retryBtn" class="btn">다시 하기</button>
      <button id="homeBtn" class="btn ghost">처음으로</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------- 캔버스 설정
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- 사운드
// 음원 파일 없이 Web Audio 로 직접 만들어 쓴다. 효과음과 배경음악의 볼륨을
// 따로 두고, 브라우저 정책에 맞춰 첫 조작 때 오디오를 깨운다.
let actx = null, masterGain = null, sfxGain = null, musicGain = null, noiseBuf = null;
let soundOn = true;
try { soundOn = localStorage.getItem("af_sound") !== "0"; } catch (e) {}

function initAudio() {
  if (actx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = soundOn ? 1 : 0;
    masterGain.connect(actx.destination);

    sfxGain = actx.createGain();
    sfxGain.gain.value = 0.9;
    sfxGain.connect(masterGain);

    musicGain = actx.createGain();
    musicGain.gain.value = 0;          // 음악은 재생 시작할 때 서서히 올린다
    musicGain.connect(masterGain);

    // 폭발음·하이햇용 화이트 노이즈
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  } catch (e) { actx = null; return false; }
}

function resumeAudio() {
  if (!initAudio()) return;
  if (actx.state === "suspended") actx.resume();
}

/** 한 음 재생. dest 를 주면 그쪽으로 (음악은 musicGain) 보낸다. */
function tone(o = {}) {
  if (!actx) return;
  const t0 = o.time ?? actx.currentTime;
  const dur = o.dur ?? 0.15;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = o.type || "square";
  osc.frequency.setValueAtTime(o.freq, t0);
  if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slideTo), t0 + dur);

  const vol = o.vol ?? 0.05;
  const atk = o.attack ?? 0.005;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  osc.connect(g);
  g.connect(o.dest || sfxGain);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

/** 노이즈 한 방 (폭발, 하이햇, 스네어) */
function noise(o = {}) {
  if (!actx || !noiseBuf) return;
  const t0 = o.time ?? actx.currentTime;
  const dur = o.dur ?? 0.2;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const filter = actx.createBiquadFilter();
  filter.type = o.filter || "lowpass";
  filter.frequency.setValueAtTime(o.freq ?? 1200, t0);
  if (o.freqTo) filter.frequency.exponentialRampToValueAtTime(Math.max(60, o.freqTo), t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(o.vol ?? 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter); filter.connect(g); g.connect(o.dest || sfxGain);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}

// --- 효과음 모음
const SFX = {
  shoot:    () => tone({ freq: 1250, slideTo: 780, dur: 0.06, type: "square",   vol: 0.022 }),
  hit:      () => tone({ freq: 520,  slideTo: 300, dur: 0.05, type: "square",   vol: 0.02 }),
  boom:     () => { noise({ freq: 1800, freqTo: 120, dur: 0.32, vol: 0.09 });
                    tone({ freq: 180, slideTo: 60, dur: 0.28, type: "triangle", vol: 0.05 }); },
  bigBoom:  () => { noise({ freq: 2400, freqTo: 80, dur: 0.7, vol: 0.13 });
                    tone({ freq: 140, slideTo: 40, dur: 0.6, type: "sawtooth",  vol: 0.07 }); },
  enemyFire:() => tone({ freq: 300, slideTo: 180, dur: 0.09, type: "sawtooth",  vol: 0.022 }),
  heal:     () => [523, 659, 784].forEach((f, i) => tone({ freq: f, dur: 0.14, type: "sine", vol: 0.05, time: actx.currentTime + i * 0.06 })),
  power:    () => [659, 880, 1175].forEach((f, i) => tone({ freq: f, dur: 0.13, type: "square", vol: 0.035, time: actx.currentTime + i * 0.05 })),
  shield:   () => { tone({ freq: 440, slideTo: 880, dur: 0.3, type: "sine", vol: 0.05 });
                    tone({ freq: 660, dur: 0.3, type: "sine", vol: 0.03 }); },
  bombGet:  () => [392, 523].forEach((f, i) => tone({ freq: f, dur: 0.16, type: "triangle", vol: 0.05, time: actx.currentTime + i * 0.07 })),
  bombUse:  () => { noise({ freq: 3000, freqTo: 100, dur: 0.9, vol: 0.14 });
                    tone({ freq: 220, slideTo: 30, dur: 0.8, type: "sawtooth", vol: 0.08 }); },
  damage:   () => { tone({ freq: 300, slideTo: 90, dur: 0.3, type: "sawtooth", vol: 0.07 });
                    noise({ freq: 800, freqTo: 100, dur: 0.25, vol: 0.06 }); },
  guard:    () => tone({ freq: 900, slideTo: 500, dur: 0.25, type: "triangle", vol: 0.055 }),
  levelUp:  () => [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.18, type: "square", vol: 0.04, time: actx.currentTime + i * 0.08 })),
  bossWarn: () => [110, 110, 98].forEach((f, i) => tone({ freq: f, dur: 0.35, type: "sawtooth", vol: 0.075, time: actx.currentTime + i * 0.22 })),
  start:    () => [523, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.16, type: "square", vol: 0.045, time: actx.currentTime + i * 0.09 })),
  save:     () => [784, 988, 1319].forEach((f, i) => tone({ freq: f, dur: 0.2, type: "sine", vol: 0.05, time: actx.currentTime + i * 0.08 })),
  gameOver: () => [523, 440, 349, 262].forEach((f, i) => tone({ freq: f, dur: 0.45, type: "triangle", vol: 0.06, time: actx.currentTime + i * 0.18 })),
};

function sfx(name) {
  if (!soundOn || !actx) return;
  try { SFX[name] && SFX[name](); } catch (e) { /* 소리 실패는 게임을 막지 않는다 */ }
}

// --- 배경음악 (16분음표 시퀀서)
// 코드 진행 위에 베이스 · 아르페지오 · 드럼을 얹는다. 보스전은 조성과 템포가 바뀐다.
const MUSIC = {
  normal: { bpm: 138, chords: [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 207.65, 246.94]] },
  boss:   { bpm: 158, chords: [[146.83, 174.61, 220], [155.56, 196, 233.08], [138.59, 174.61, 207.65], [146.83, 185, 220]] },
};

const music = { on: false, mode: "normal", step: 0, nextTime: 0, timer: null };

function scheduleStep(step, t) {
  const cfg = MUSIC[music.mode];
  const chord = cfg.chords[Math.floor(step / 16) % cfg.chords.length];
  const s = step % 16;
  const dest = musicGain;

  // 베이스: 8분음표
  if (s % 2 === 0) {
    tone({ freq: chord[0] / 2, dur: 0.16, type: "triangle", vol: 0.18, time: t, dest });
  }
  // 아르페지오: 16분음표
  const arp = chord[(s % 3)] * (s % 8 >= 4 ? 2 : 1);
  tone({ freq: arp, dur: 0.1, type: "square", vol: 0.045, time: t, dest });

  // 드럼
  if (s % 8 === 0) noise({ freq: 160, freqTo: 50, dur: 0.16, vol: 0.22, time: t, dest });        // 킥
  if (s % 8 === 4) noise({ freq: 2600, freqTo: 900, dur: 0.13, vol: 0.1, time: t, dest, filter: "highpass" }); // 스네어
  if (s % 2 === 1) noise({ freq: 7000, dur: 0.03, vol: 0.05, time: t, dest, filter: "highpass" });             // 하이햇
}

function musicTick() {
  if (!actx || !music.on) return;
  const cfg = MUSIC[music.mode];
  const stepDur = 60 / cfg.bpm / 4;
  while (music.nextTime < actx.currentTime + 0.15) {
    scheduleStep(music.step, music.nextTime);
    music.step = (music.step + 1) % 64;
    music.nextTime += stepDur;
  }
}

function startMusic(mode = "normal") {
  if (!initAudio()) return;
  resumeAudio();
  music.mode = mode;
  if (music.on) return;
  music.on = true;
  music.step = 0;
  music.nextTime = actx.currentTime + 0.08;
  musicGain.gain.cancelScheduledValues(actx.currentTime);
  musicGain.gain.setValueAtTime(0.0001, actx.currentTime);
  musicGain.gain.linearRampToValueAtTime(0.34, actx.currentTime + 0.6);
  clearInterval(music.timer);
  music.timer = setInterval(musicTick, 25);
  musicTick();
}

function stopMusic() {
  if (!music.on) return;
  music.on = false;
  clearInterval(music.timer);
  music.timer = null;
  if (actx && musicGain) {
    musicGain.gain.cancelScheduledValues(actx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, actx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.0001, actx.currentTime + 0.25);
  }
}

/** 보스 등장·격파에 맞춰 곡을 바꾼다. */
function setMusicMode(mode) {
  if (music.mode === mode) return;
  music.mode = mode;
  music.step = 0;
  if (actx && music.on) music.nextTime = Math.max(music.nextTime, actx.currentTime + 0.05);
}

function setSound(on) {
  soundOn = on;
  try { localStorage.setItem("af_sound", on ? "1" : "0"); } catch (e) {}
  if (!actx) { if (on) initAudio(); }
  if (actx && masterGain) {
    masterGain.gain.cancelScheduledValues(actx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
    masterGain.gain.linearRampToValueAtTime(on ? 1 : 0.0001, actx.currentTime + 0.15);
    if (on) resumeAudio();
  }
}

// ---------------------------------------------------------------- 게임 상태
const STATE = { START: 0, PLAY: 1, PAUSE: 2, OVER: 3 };
let state = STATE.START;

const game = {
  score: 0, level: 1, time: 0,
  bullets: [], enemies: [], ebullets: [], items: [], particles: [], stars: [],
  spawnTimer: 0, bossTimer: 0, boss: null, shake: 0, bombFlash: 0,
};

const player = {
  x: 0, y: 0, r: 16,
  hp: 5, maxHp: 5,
  power: 1, shield: 0, bombs: 2,
  fireCd: 0, inv: 0, alive: true, tilt: 0,
};

function resetGame() {
  game.score = 0; game.level = 1; game.time = 0;
  game.bullets.length = 0; game.enemies.length = 0; game.ebullets.length = 0;
  game.items.length = 0; game.particles.length = 0;
  game.spawnTimer = 0; game.bossTimer = 0; game.boss = null;
  game.shake = 0; game.bombFlash = 0;
  player.x = W / 2; player.y = H - 130;
  player.hp = player.maxHp; player.power = 1; player.shield = 0;
  player.bombs = 2; player.fireCd = 0; player.inv = 90; player.alive = true; player.tilt = 0;
  targetX = player.x; targetY = player.y;
}

// 배경 별
for (let i = 0; i < 90; i++) {
  game.stars.push({ x: Math.random() * 2000, y: Math.random() * 2000, s: rand(0.5, 2), v: rand(30, 140) });
}

// ---------------------------------------------------------------- 조작 (터치/마우스)
let targetX = 0, targetY = 0, dragging = false, dragDX = 0, dragDY = 0;
const BOMB_BTN = { x: 0, y: 0, r: 34 };

function updateBombBtnPos() {
  BOMB_BTN.x = W - 58;
  BOMB_BTN.y = H - 58;
}

function pointIn(px, py, c) {
  const dx = px - c.x, dy = py - c.y;
  return dx * dx + dy * dy <= (c.r + 14) * (c.r + 14);
}

function onDown(px, py) {
  if (state !== STATE.PLAY) return;
  if (pointIn(px, py, BOMB_BTN)) { useBomb(); return; }
  dragging = true;
  dragDX = player.x - px;
  dragDY = player.y - py;
}
function onMove(px, py) {
  if (!dragging || state !== STATE.PLAY) return;
  targetX = px + dragDX;
  targetY = py + dragDY;
}
function onUp() { dragging = false; }

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.changedTouches[0], r = canvas.getBoundingClientRect();
  onDown(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.changedTouches[0], r = canvas.getBoundingClientRect();
  onMove(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); onUp(); }, { passive: false });
canvas.addEventListener("touchcancel", () => onUp());

canvas.addEventListener("mousedown", e => {
  const r = canvas.getBoundingClientRect();
  onDown(e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  onMove(e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener("mouseup", onUp);

// 키보드 (PC 테스트용)
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " " && state === STATE.PLAY) { e.preventDefault(); useBomb(); }
  if (e.key === "Escape" && state === STATE.PLAY) togglePause(true);
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

// ---------------------------------------------------------------- 파티클 / 효과
function burst(x, y, color, n = 14, spd = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(spd * 0.2, spd);
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.3, 0.8), max: 0.8, color, size: rand(2, 5),
    });
  }
}

// ---------------------------------------------------------------- 적 생성
const ENEMY_TYPES = {
  scout:   { hp: 1, r: 15, score: 10, color: "#ff7a7a", speed: 110 },
  bomber:  { hp: 4, r: 22, score: 30, color: "#ffb347", speed: 70  },
  zigzag:  { hp: 2, r: 17, score: 20, color: "#c084fc", speed: 130 },
};

function spawnEnemy() {
  const lv = game.level;
  const roll = Math.random();
  let type = "scout";
  if (lv >= 2 && roll > 0.75) type = "bomber";
  else if (lv >= 2 && roll > 0.5) type = "zigzag";

  const t = ENEMY_TYPES[type];
  game.enemies.push({
    type, x: rand(30, W - 30), y: -40,
    r: t.r, hp: t.hp + Math.floor(lv / 3), maxHp: t.hp + Math.floor(lv / 3),
    color: t.color, score: t.score,
    vy: t.speed * (1 + lv * 0.05), vx: type === "zigzag" ? rand(60, 110) * (Math.random() < 0.5 ? -1 : 1) : 0,
    fireCd: rand(0.8, 2.2), phase: Math.random() * 6.28, hit: 0,
  });
}

function spawnBoss() {
  const lv = game.level;
  game.boss = {
    x: W / 2, y: -100, r: 52,
    hp: 60 + lv * 40, maxHp: 60 + lv * 40,
    vx: 90 + lv * 8, fireCd: 1.2, pattern: 0, patternT: 0, hit: 0, entering: true,
  };
  sfx("bossWarn");
  setMusicMode("boss");
}

// ---------------------------------------------------------------- 발사
function playerShoot() {
  const p = player.power;
  const shoot = (dx, ox) => game.bullets.push({ x: player.x + ox, y: player.y - 18, vx: dx, vy: -620, r: 5 });
  if (p === 1) shoot(0, 0);
  else if (p === 2) { shoot(0, -9); shoot(0, 9); }
  else if (p === 3) { shoot(0, -11); shoot(0, 11); shoot(0, 0); }
  else { shoot(0, -13); shoot(0, 13); shoot(-140, -6); shoot(140, 6); }
  sfx("shoot");
}

function useBomb() {
  if (player.bombs <= 0) return;
  player.bombs--;
  game.bombFlash = 1;
  game.shake = 16;
  sfx("bombUse");
  game.ebullets.length = 0;
  for (const e of game.enemies) {
    burst(e.x, e.y, e.color, 16);
    game.score += e.score;
  }
  game.enemies.length = 0;
  if (game.boss) { game.boss.hp -= 60; game.boss.hit = 0.3; burst(game.boss.x, game.boss.y, "#fff", 30, 320); }
}

// ---------------------------------------------------------------- 아이템
const ITEM_KIND = ["heal", "power", "shield", "bomb"];
function maybeDropItem(x, y) {
  if (Math.random() > 0.16) return;
  const kind = ITEM_KIND[Math.floor(Math.random() * ITEM_KIND.length)];
  game.items.push({ x, y, r: 13, vy: 90, kind, t: 0 });
}

function pickItem(it) {
  if (it.kind === "heal") { player.hp = Math.min(player.maxHp, player.hp + 1); sfx("heal"); }
  else if (it.kind === "power") { player.power = Math.min(4, player.power + 1); sfx("power"); }
  else if (it.kind === "bomb") {
    if (player.bombs < 5) player.bombs++;
    else game.score += 100;          // 이미 가득이면 헛되지 않게 점수로
    sfx("bombGet");
  }
  else { player.shield = 6; sfx("shield"); }
  burst(it.x, it.y, "#fff", 10, 150);
}

// ---------------------------------------------------------------- 피격
function damagePlayer(amount) {
  if (player.inv > 0 || !player.alive) return;
  if (player.shield > 0) {
    player.shield = 0;
    player.inv = 60;
    burst(player.x, player.y, "#ffe066", 20, 260);
    sfx("guard");
    return;
  }
  player.hp -= amount;
  player.inv = 90;
  game.shake = 12;
  burst(player.x, player.y, "#ff9d5c", 18, 240);
  sfx("damage");
  if (player.hp <= 0) {
    player.hp = 0; player.alive = false;
    burst(player.x, player.y, "#ffd166", 50, 420);
    setTimeout(gameOver, 700);
  }
}

// ---------------------------------------------------------------- 업데이트
function update(dt) {
  game.time += dt;
  const newLevel = 1 + Math.floor(game.score / 800);
  if (newLevel > game.level) { game.level = newLevel; sfx("levelUp"); }

  // 별
  for (const s of game.stars) {
    s.y += s.v * dt;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    if (s.x > W) s.x = Math.random() * W;
  }

  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
  if (game.bombFlash > 0) game.bombFlash = Math.max(0, game.bombFlash - dt * 2.5);

  // --- 플레이어
  if (player.alive) {
    // 키보드 이동
    const kSpd = 380 * dt;
    if (keys.ArrowLeft || keys.a) targetX -= kSpd;
    if (keys.ArrowRight || keys.d) targetX += kSpd;
    if (keys.ArrowUp || keys.w) targetY -= kSpd;
    if (keys.ArrowDown || keys.s) targetY += kSpd;

    targetX = clamp(targetX, player.r, W - player.r);
    targetY = clamp(targetY, player.r + 60, H - player.r - 20);

    const prevX = player.x;
    player.x += (targetX - player.x) * Math.min(1, dt * 16);
    player.y += (targetY - player.y) * Math.min(1, dt * 16);
    player.tilt = clamp((player.x - prevX) * 0.06, -0.5, 0.5);

    if (player.inv > 0) player.inv--;
    if (player.shield > 0) player.shield = Math.max(0, player.shield - dt);

    player.fireCd -= dt;
    if (player.fireCd <= 0) {
      playerShoot();
      player.fireCd = player.power >= 3 ? 0.11 : 0.14;
    }
  }

  // --- 적 생성
  if (!game.boss) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnEnemy();
      game.spawnTimer = Math.max(0.25, 1.0 - game.level * 0.06);
    }
    game.bossTimer += dt;
    if (game.bossTimer > 32) { game.bossTimer = 0; spawnBoss(); }
  }

  // --- 아군 총알
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) { game.bullets.splice(i, 1); }
  }

  // --- 적
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];
    e.y += e.vy * dt;
    if (e.type === "zigzag") {
      e.x += e.vx * dt;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
    }
    if (e.hit > 0) e.hit -= dt;

    // 적 발사
    e.fireCd -= dt;
    if (e.fireCd <= 0 && e.y > 0 && e.y < H * 0.7) {
      e.fireCd = rand(1.4, 3.0) / (1 + game.level * 0.06);
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      const spd = 200 + game.level * 8;
      if (e.type === "bomber") {
        for (let k = -1; k <= 1; k++) {
          game.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(ang + k * 0.25) * spd, vy: Math.sin(ang + k * 0.25) * spd, r: 6 });
        }
      } else {
        game.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5 });
      }
    }

    // 아군 총알 충돌
    let dead = false;
    for (let j = game.bullets.length - 1; j >= 0; j--) {
      const b = game.bullets[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (e.r + b.r) * (e.r + b.r)) {
        game.bullets.splice(j, 1);
        e.hp--; e.hit = 0.12;
        burst(b.x, b.y, "#ffe9a8", 4, 100);
        if (e.hp <= 0) {
          game.score += e.score;
          burst(e.x, e.y, e.color, 18, 260);
          maybeDropItem(e.x, e.y);
          sfx("boom");
          game.enemies.splice(i, 1);
          dead = true;
          break;
        }
      }
    }
    if (dead) continue;

    // 플레이어 충돌
    const pdx = player.x - e.x, pdy = player.y - e.y;
    if (player.alive && pdx * pdx + pdy * pdy < (e.r + player.r) * (e.r + player.r)) {
      burst(e.x, e.y, e.color, 16);
      game.enemies.splice(i, 1);
      damagePlayer(1);
      continue;
    }
    if (e.y > H + 60) game.enemies.splice(i, 1);
  }

  // --- 보스
  const boss = game.boss;
  if (boss) {
    if (boss.entering) {
      boss.y += 70 * dt;
      if (boss.y >= 110) { boss.y = 110; boss.entering = false; }
    } else {
      boss.x += boss.vx * dt;
      if (boss.x < boss.r) { boss.x = boss.r; boss.vx *= -1; }
      if (boss.x > W - boss.r) { boss.x = W - boss.r; boss.vx *= -1; }
      boss.y = 110 + Math.sin(game.time * 1.5) * 18;

      boss.patternT += dt;
      if (boss.patternT > 6) { boss.patternT = 0; boss.pattern = (boss.pattern + 1) % 2; }

      boss.fireCd -= dt;
      if (boss.fireCd <= 0) {
        const spd = 210;
        if (boss.pattern === 0) {
          // 부채꼴
          const base = Math.atan2(player.y - boss.y, player.x - boss.x);
          for (let k = -2; k <= 2; k++) {
            game.ebullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(base + k * 0.2) * spd, vy: Math.sin(base + k * 0.2) * spd, r: 7 });
          }
          boss.fireCd = 1.0;
        } else {
          // 원형 탄막
          const off = game.time * 2;
          for (let k = 0; k < 12; k++) {
            const a = off + (k / 12) * Math.PI * 2;
            game.ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * spd * 0.8, vy: Math.sin(a) * spd * 0.8, r: 6 });
          }
          boss.fireCd = 1.4;
        }
        sfx("enemyFire");
      }
    }
    if (boss.hit > 0) boss.hit -= dt;

    for (let j = game.bullets.length - 1; j >= 0; j--) {
      const b = game.bullets[j];
      const dx = b.x - boss.x, dy = b.y - boss.y;
      if (dx * dx + dy * dy < (boss.r + b.r) * (boss.r + b.r)) {
        game.bullets.splice(j, 1);
        boss.hp--; boss.hit = 0.1;
        burst(b.x, b.y, "#ffe9a8", 3, 90);
      }
    }
    const bdx = player.x - boss.x, bdy = player.y - boss.y;
    if (player.alive && bdx * bdx + bdy * bdy < (boss.r + player.r) * (boss.r + player.r)) damagePlayer(1);

    if (boss.hp <= 0) {
      game.score += 500;
      game.shake = 20;
      for (let k = 0; k < 5; k++) {
        setTimeout(() => burst(boss.x + rand(-40, 40), boss.y + rand(-30, 30), "#ffd166", 24, 340), k * 90);
      }
      sfx("bigBoom");
      setMusicMode("normal");
      game.items.push({ x: boss.x, y: boss.y, r: 13, vy: 80, kind: "power", t: 0 });
      game.items.push({ x: boss.x - 40, y: boss.y, r: 13, vy: 80, kind: "heal", t: 0 });
      player.bombs = Math.min(5, player.bombs + 1);
      game.boss = null;
    }
  }

  // --- 적 총알
  for (let i = game.ebullets.length - 1; i >= 0; i--) {
    const b = game.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 30 || b.y < -30 || b.x < -30 || b.x > W + 30) { game.ebullets.splice(i, 1); continue; }
    if (!player.alive) continue;
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy < (b.r + player.r * 0.7) * (b.r + player.r * 0.7)) {
      game.ebullets.splice(i, 1);
      damagePlayer(1);
    }
  }

  // --- 아이템
  for (let i = game.items.length - 1; i >= 0; i--) {
    const it = game.items[i];
    it.y += it.vy * dt; it.t += dt;
    if (it.y > H + 30) { game.items.splice(i, 1); continue; }
    const dx = it.x - player.x, dy = it.y - player.y;
    if (player.alive && dx * dx + dy * dy < (it.r + player.r + 8) * (it.r + player.r + 8)) {
      pickItem(it);
      game.items.splice(i, 1);
    }
  }

  // --- 파티클
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

// ---------------------------------------------------------------- 그리기
function drawShip(x, y, tilt) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // 엔진 불꽃
  const f = 10 + Math.sin(game.time * 40) * 5;
  const grad = ctx.createLinearGradient(0, 14, 0, 14 + f);
  grad.addColorStop(0, "rgba(255,200,80,.95)");
  grad.addColorStop(1, "rgba(255,80,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-6, 12); ctx.lineTo(6, 12); ctx.lineTo(0, 14 + f);
  ctx.closePath(); ctx.fill();

  // 날개
  ctx.fillStyle = "#2f6fd0";
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(20, 14); ctx.lineTo(0, 8); ctx.lineTo(-20, 14);
  ctx.closePath(); ctx.fill();

  // 몸통
  ctx.fillStyle = "#eaf4ff";
  ctx.beginPath();
  ctx.moveTo(0, -22); ctx.lineTo(9, 10); ctx.lineTo(0, 14); ctx.lineTo(-9, 10);
  ctx.closePath(); ctx.fill();

  // 조종석
  ctx.fillStyle = "#63d2ff";
  ctx.beginPath(); ctx.ellipse(0, -6, 4.5, 7, 0, 0, 6.3); ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.hit > 0 ? "#fff" : e.color;
  if (e.type === "bomber") {
    ctx.beginPath();
    ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.5); ctx.lineTo(0, -e.r * 0.2); ctx.lineTo(-e.r, -e.r * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.35, 0, 6.3); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, e.r); ctx.lineTo(e.r * 0.9, -e.r * 0.7); ctx.lineTo(-e.r * 0.9, -e.r * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath(); ctx.arc(0, e.r * 0.1, e.r * 0.25, 0, 6.3); ctx.fill();
  }
  ctx.restore();

  if (e.maxHp > 2) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w, 4);
    ctx.fillStyle = "#7CFC9B";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w * (e.hp / e.maxHp), 4);
  }
}

function drawBoss(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = b.hit > 0 ? "#fff" : "#a33bd6";
  ctx.beginPath();
  ctx.moveTo(0, b.r); ctx.lineTo(b.r, b.r * 0.2); ctx.lineTo(b.r * 0.7, -b.r * 0.7);
  ctx.lineTo(-b.r * 0.7, -b.r * 0.7); ctx.lineTo(-b.r, b.r * 0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ff5470";
  ctx.beginPath(); ctx.arc(0, 0, b.r * 0.3, 0, 6.3); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.75)";
  ctx.beginPath(); ctx.arc(-b.r * 0.45, -b.r * 0.25, 5, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(b.r * 0.45, -b.r * 0.25, 5, 0, 6.3); ctx.fill();
  ctx.restore();

  // 보스 체력바
  const bw = Math.min(W - 60, 320);
  const bx = (W - bw) / 2, by = 62;
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillRect(bx, by, bw, 10);
  ctx.fillStyle = "#ff4d6d";
  ctx.fillRect(bx, by, bw * Math.max(0, b.hp / b.maxHp), 10);
  ctx.fillStyle = "#ffd0d8";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("보스", W / 2, by - 4);
}

const ITEM_STYLE = {
  heal:   { c: "#4ade80", label: "＋" },
  power:  { c: "#60a5fa", label: "⚡" },
  shield: { c: "#fbbf24", label: "🛡" },
  bomb:   { c: "#f472b6", label: "💣" },
};

function drawHUD() {
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const top = 22;

  // 체력 하트
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? "#ff5470" : "rgba(255,255,255,.18)";
    const hx = 16 + i * 20, hy = top;
    ctx.beginPath();
    ctx.arc(hx - 3.5, hy - 2, 4, 0, 6.3);
    ctx.arc(hx + 3.5, hy - 2, 4, 0, 6.3);
    ctx.moveTo(hx - 7.5, hy - 0.5);
    ctx.lineTo(hx, hy + 8);
    ctx.lineTo(hx + 7.5, hy - 0.5);
    ctx.closePath(); ctx.fill();
  }

  // 점수 / 레벨
  ctx.fillStyle = "#ffd76a";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(String(game.score), W - 118, top);
  ctx.fillStyle = "#9fb6d9";
  ctx.font = "bold 12px sans-serif";
  ctx.fillText("LV " + game.level, W - 118, top + 20);

  // 보호막 표시
  if (player.shield > 0) {
    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🛡 " + player.shield.toFixed(1) + "초", 16, top + 24);
  }

  // 폭탄 버튼
  ctx.globalAlpha = player.bombs > 0 ? 1 : 0.3;
  ctx.beginPath();
  ctx.arc(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.r, 0, 6.3);
  ctx.fillStyle = "rgba(255,90,90,.28)";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "#ff8080";
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("💥", BOMB_BTN.x, BOMB_BTN.y - 2);
  ctx.font = "bold 12px sans-serif";
  ctx.fillText("×" + player.bombs, BOMB_BTN.x, BOMB_BTN.y + 20);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function render() {
  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-game.shake, game.shake) * 0.4, rand(-game.shake, game.shake) * 0.4);

  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0a1230");
  bg.addColorStop(1, "#05081a");
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // 별
  for (const s of game.stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.25 + s.s * 0.3})`;
    ctx.fillRect(s.x % W, s.y, s.s, s.s * 2.5);
  }

  // 아이템
  for (const it of game.items) {
    const st = ITEM_STYLE[it.kind];
    const pulse = 1 + Math.sin(it.t * 8) * 0.12;
    ctx.save();
    ctx.translate(it.x, it.y); ctx.scale(pulse, pulse);
    ctx.fillStyle = st.c;
    ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 6.3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(st.label, 0, 1);
    ctx.restore();
  }

  // 아군 총알
  ctx.fillStyle = "#ffe066";
  for (const b of game.bullets) {
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r * 0.7, b.r * 1.8, 0, 0, 6.3);
    ctx.fill();
  }

  // 적
  for (const e of game.enemies) drawEnemy(e);
  if (game.boss) drawBoss(game.boss);

  // 적 총알
  for (const b of game.ebullets) {
    ctx.fillStyle = "#ff6b8a";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.beginPath(); ctx.arc(b.x - 1.5, b.y - 1.5, b.r * 0.4, 0, 6.3); ctx.fill();
  }

  // 파티클
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 플레이어
  if (player.alive && (player.inv <= 0 || Math.floor(player.inv / 5) % 2 === 0)) {
    drawShip(player.x, player.y, player.tilt);
  }
  if (player.alive && player.shield > 0) {
    ctx.strokeStyle = `rgba(251,191,36,${0.4 + Math.sin(game.time * 8) * 0.25})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 12, 0, 6.3); ctx.stroke();
  }

  ctx.restore();

  drawHUD();

  if (game.bombFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${game.bombFlash * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- 루프
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state === STATE.PLAY) update(dt);
  if (state !== STATE.START) render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- 화면 전환
const startScreen = document.getElementById("startScreen");
const pauseScreen = document.getElementById("pauseScreen");
const overScreen  = document.getElementById("overScreen");
const pauseBtn    = document.getElementById("pauseBtn");

// ---------------------------------------------------------------- 순위표
const RANK_MAX = 10, RANK_SHOW = 5;
const nameEntry = document.getElementById("nameEntry");
const nameInput = document.getElementById("nameInput");
const rankOver  = document.getElementById("rankOver");
const rankHome  = document.getElementById("rankHome");

// 이름당 최고 기록 하나만 남긴다. 한 사람이 순위표를 독식하지 않도록.
function bestPerName(list) {
  const byName = new Map();
  for (const r of list) {
    const prev = byName.get(r.n);
    if (!prev || r.s > prev.s) byName.set(r.n, r);
  }
  return [...byName.values()].sort((a, b) => b.s - a.s);
}

function loadRanks() {
  try {
    const raw = JSON.parse(localStorage.getItem("af_ranks") || "[]");
    if (!Array.isArray(raw)) return [];
    const cleaned = raw
      .filter(r => r && typeof r.s === "number")
      .map(r => ({ n: String(r.n || "무명").slice(0, 6), s: r.s | 0, lv: r.lv | 0 }));
    return bestPerName(cleaned).slice(0, RANK_MAX);
  } catch (e) { return []; }
}
function storeRanks(list) {
  try { localStorage.setItem("af_ranks", JSON.stringify(list)); } catch (e) {}
}
// --- 공유 순위표 서버 (config.js 에서 주소를 지정하면 켜진다)
const API = String(
  new URLSearchParams(location.search).get("api") || window.AIR_FIGHT_API || ""
).replace(/\/+$/, "");
const SHARED = /^https?:\/\//.test(API);

// 화면에 그릴 목록. 공유 모드에서는 서버 기록, 아니면 이 기기의 기록.
let board = loadRanks();
let boardOffline = false;      // 공유 모드인데 서버에 닿지 못한 상태
let boardLoading = SHARED;

function normalize(list) {
  const cleaned = (Array.isArray(list) ? list : [])
    .filter(r => r && typeof r.s === "number" && Number.isFinite(r.s))
    .map(r => ({ n: String(r.n || "무명").slice(0, 6), s: Math.trunc(r.s), lv: Math.trunc(r.lv) || 1 }));
  return bestPerName(cleaned).slice(0, RANK_MAX);
}

async function apiGet() {
  const res = await fetch(API + "/scores", { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return normalize((await res.json()).scores);
}

async function apiPost(name, score, level) {
  const res = await fetch(API + "/scores", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, score, level }),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return normalize((await res.json()).scores);
}

// 서버 기록을 다시 받아온다. 실패하면 이 기기 기록으로 대신 보여준다.
async function refreshBoard(el) {
  if (!SHARED) { board = loadRanks(); if (el) renderRank(el, null); return; }
  boardLoading = true;
  if (el) renderRank(el, null);
  try {
    board = await apiGet();
    boardOffline = false;
  } catch (e) {
    board = loadRanks();
    boardOffline = true;
  }
  boardLoading = false;
  if (el) renderRank(el, null);
}

function bestScore() { return board.length ? board[0].s : 0; }

// 순위표에 오를 만한 점수인지
function qualifies(score) {
  if (score <= 0) return false;
  return board.length < RANK_MAX || score > board[board.length - 1].s;
}

// 새 기록을 넣고, 그 기록의 순위(0부터)를 돌려준다. 밀려나면 -1.
function addRank(name, score, lv) {
  const entry = { n: name, s: score, lv };
  const list = loadRanks();
  list.push(entry);
  const cut = bestPerName(list).slice(0, RANK_MAX);
  storeRanks(cut);
  return cut.indexOf(entry);
}

// me: 방금 등록한 기록 {n, s} — 목록에서 찾아 강조한다.
function renderRank(el, me) {
  const list = board.slice(0, RANK_SHOW);
  const meIdx = me ? list.findIndex(r => r.n === me.n) : -1;

  el.textContent = "";
  el.classList.remove("hidden");

  const title = document.createElement("div");
  title.className = "rank-title";
  title.textContent = SHARED ? "🏆 우리 가족 순위표" : "🏆 순위표";
  el.appendChild(title);

  if (boardLoading) {
    const wait = document.createElement("div");
    wait.className = "rank-empty";
    wait.textContent = "불러오는 중…";
    el.appendChild(wait);
    return;
  }

  const offlineNote = () => {
    if (!boardOffline) return;
    const note = document.createElement("div");
    note.className = "rank-empty";
    note.textContent = "서버에 연결하지 못해 이 기기 기록만 보여요";
    el.appendChild(note);
  };

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "rank-empty";
    empty.textContent = "아직 기록이 없어요. 첫 주인공이 되어 보세요!";
    el.appendChild(empty);
    offlineNote();
    return;
  }

  list.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "rank-row" + (i === meIdx ? " me" : "") + (i < 3 ? " top" + (i + 1) : "");

    const pos = document.createElement("span");
    pos.className = "pos";
    pos.textContent = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : String(i + 1);

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = r.n;               // textContent 로만 넣어 입력값을 그대로 표시

    const sc = document.createElement("span");
    sc.className = "sc";
    sc.textContent = r.s.toLocaleString("ko-KR");

    row.append(pos, nm, sc);
    el.appendChild(row);
  });

  offlineNote();
}

function cleanName(v) {
  const t = (v || "").replace(/\s+/g, " ").trim().slice(0, 6);
  return t || "무명";
}

let pendingScore = null;   // 아직 이름을 안 남긴 기록
const saveBtn = document.getElementById("saveScoreBtn");

async function submitScore() {
  if (!pendingScore) return;
  const { score, lv } = pendingScore;
  const name = cleanName(nameInput.value);
  pendingScore = null;                       // 두 번 등록되지 않게 먼저 비운다
  try { localStorage.setItem("af_name", name); } catch (e) {}

  addRank(name, score, lv);                  // 기기에도 항상 남긴다
  nameEntry.classList.add("hidden");
  sfx("save");

  if (!SHARED) {
    board = loadRanks();
    renderRank(rankOver, { n: name, s: score });
    return;
  }

  boardLoading = true;
  renderRank(rankOver, null);
  try {
    board = await apiPost(name, score, lv);
    boardOffline = false;
  } catch (e) {
    board = loadRanks();                     // 서버가 안 되면 기기 기록으로 보여준다
    boardOffline = true;
  }
  boardLoading = false;
  renderRank(rankOver, { n: name, s: score });
}

saveBtn.addEventListener("click", submitScore);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submitScore(); } });

function startGame() {
  if (pendingScore) submitScore();   // 이름을 안 남기고 넘어가도 기록은 지킨다
  nameEntry.classList.add("hidden");
  updateBombBtnPos();
  resetGame();
  state = STATE.PLAY;
  startScreen.classList.add("hidden");
  overScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  pauseBtn.classList.remove("hidden");
  last = performance.now();
  resumeAudio();
  sfx("start");
  startMusic(game.boss ? "boss" : "normal");
}

function togglePause(on) {
  if (on) { state = STATE.PAUSE; pauseScreen.classList.remove("hidden"); stopMusic(); }
  else { state = STATE.PLAY; pauseScreen.classList.add("hidden"); last = performance.now(); startMusic(music.mode); }
}

function goHome() {
  stopMusic();
  if (pendingScore) submitScore();
  state = STATE.START;
  pauseScreen.classList.add("hidden");
  overScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
  pauseBtn.classList.add("hidden");
  refreshBoard(rankHome);
}

async function gameOver() {
  const score = game.score, lv = game.level;
  state = STATE.OVER;
  pauseBtn.classList.add("hidden");
  stopMusic();
  sfx("gameOver");

  document.getElementById("finalScore").textContent = score.toLocaleString("ko-KR");
  document.getElementById("overTitle").textContent = "격추당했어요!";
  document.getElementById("overSub").textContent = "레벨 " + lv;
  pendingScore = null;
  nameEntry.classList.add("hidden");
  renderRank(rankOver, null);

  overScreen.classList.remove("hidden");
  overScreen.classList.remove("fade"); void overScreen.offsetWidth; overScreen.classList.add("fade");

  // 순위 판정은 최신 목록으로 한다. 그 사이 가족이 세운 기록도 반영되도록.
  await refreshBoard(rankOver);
  if (state !== STATE.OVER) return;      // 그새 다시 시작했으면 건드리지 않는다

  const best = bestScore();
  const isNew = score > best;
  document.getElementById("overTitle").textContent = isNew ? "신기록 달성! 🎉" : "격추당했어요!";
  document.getElementById("overSub").textContent =
    (isNew ? "역대 최고 점수예요!" : "최고 점수 " + Math.max(best, score).toLocaleString("ko-KR"))
    + " · 레벨 " + lv;

  if (qualifies(score)) {
    pendingScore = { score, lv };
    try { nameInput.value = localStorage.getItem("af_name") || ""; } catch (e) { nameInput.value = ""; }
    nameEntry.classList.remove("hidden");
    rankOver.classList.add("hidden");
  }
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("retryBtn").addEventListener("click", startGame);
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("quitBtn").addEventListener("click", goHome);
document.getElementById("resumeBtn").addEventListener("click", () => togglePause(false));
pauseBtn.addEventListener("click", () => togglePause(true));

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === STATE.PLAY) togglePause(true);
});

window.addEventListener("resize", () => {
  updateBombBtnPos();
  targetX = clamp(targetX, player.r, W - player.r);
  targetY = clamp(targetY, player.r + 60, H - player.r - 20);
});
updateBombBtnPos();
refreshBoard(rankHome);

const soundBtn = document.getElementById("soundBtn");
function paintSoundBtn() {
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  soundBtn.classList.toggle("off", !soundOn);
}
soundBtn.addEventListener("click", () => {
  setSound(!soundOn);
  paintSoundBtn();
  if (soundOn && state === STATE.PLAY) startMusic(music.mode);
});
paintSoundBtn();

})();
</script>
